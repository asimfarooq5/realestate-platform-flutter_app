# Production web server for the Zameen Flutter web app.
# Serves the static build and proxies /api to the FastAPI backend.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Flutter web SPA fallback — serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-lived cache for hashed assets
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /flutter.js {
        expires 30d;
    }

    location /canvaskit/ {
        expires 30d;
    }

    # Proxy API calls to the backend service
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8000/health;
    }
}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zameen_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zameen_password}
      POSTGRES_DB: ${POSTGRES_DB:-zameen}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zameen_user} -d ${POSTGRES_DB:-zameen}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ../fastapi-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-zameen_user}:${POSTGRES_PASSWORD:-zameen_password}@db:5432/${POSTGRES_DB:-zameen}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-5}
      LOGIN_RATE_WINDOW: ${LOGIN_RATE_WINDOW:-300}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["*"]}
    expose:
      - "8000"

  web:
    build:
      context: .
      args:
        API_BASE_URL: ${WEB_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  postgres_data:
